plugins {
    id "com.android.application"
}

android {
    namespace "br.heitor.carlink"
    compileSdk 34

    defaultConfig {
        applicationId "br.heitor.carlink"
        minSdk 23
        targetSdk 34
        // Número da versão = VERSION_CODE do GitHub Actions (100 + número da compilação),
        // usado pelo botão "Atualizar app". Começa em 100 para ficar acima das builds
        // antigas do repositório TESTS-AND-SHEESH e instalar por cima delas.
        def build = (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionCode build
        versionName "1.0"
    }

    signingConfigs {
        // Chave de teste fixa, para que cada versão nova instale por cima da anterior.
        debug {
            storeFile file("carlink-test.keystore")
            storePassword "android"
            keyAlias "carlink"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
